name: deepsight-development

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DEEPSIGHT_POSTGRES_DB:-deepsight}
      POSTGRES_USER: ${DEEPSIGHT_POSTGRES_USER:-deepsight}
      POSTGRES_PASSWORD: ${DEEPSIGHT_POSTGRES_PASSWORD:-development_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${DEEPSIGHT_POSTGRES_USER:-deepsight}:${DEEPSIGHT_POSTGRES_PASSWORD:-development_password}@postgres:5432/${DEEPSIGHT_POSTGRES_DB:-deepsight}
      SECRET_KEY: ${DEEPSIGHT_SECRET_KEY:-development-only-secret-key-change-before-use}
      FIREBASE_ENABLED: "false"
      MODEL_LOADING: lazy
      FRONTEND_ORIGINS: http://127.0.0.1:5173
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage_data:/app/uploads
      - report_data:/app/reports
      - ./backend/app/models/production:/app/app/models/production:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${DEEPSIGHT_POSTGRES_USER:-deepsight}:${DEEPSIGHT_POSTGRES_PASSWORD:-development_password}@postgres:5432/${DEEPSIGHT_POSTGRES_DB:-deepsight}
      SECRET_KEY: ${DEEPSIGHT_SECRET_KEY:-development-only-secret-key-change-before-use}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MODEL_LOADING: lazy
    volumes:
      - ./backend:/app
      - storage_data:/app/uploads
      - report_data:/app/reports
      - ./backend/app/models/production:/app/app/models/production:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  report_data:
