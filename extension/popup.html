<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSight</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <header><img src="logo.png" alt=""><div><strong>DeepSight System</strong><span id="account">Not signed in</span></div></header>
    <form id="login-form">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <section id="controls" hidden>
      <button id="scan" type="button">Scan Current Page</button>
      <label id="pro-row"><input id="pro" type="checkbox"> Continuous Pro detection</label>
      <button id="logout" type="button" class="secondary">Sign Out</button>
    </section>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
