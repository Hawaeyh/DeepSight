name: Backend tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deepsight_test
          POSTGRES_USER: deepsight_test
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsight_test -d deepsight_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DATABASE_URL: sqlite:////tmp/deepsight-tests.db
      SECRET_KEY: ci-testing-secret-key-at-least-32-characters
      FIREBASE_ENABLED: "false"
      MODEL_LOADING: disabled
      LOCAL_STORAGE_ROOT: /tmp/deepsight-storage
      REPORT_ROOT: /tmp/deepsight-reports
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://deepsight_test:test_password@localhost:5432/deepsight_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts tests
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://deepsight_test:test_password@localhost:5432/deepsight_test
      - run: python scripts/check_database.py
        env:
          DATABASE_URL: postgresql+psycopg://deepsight_test:test_password@localhost:5432/deepsight_test
      - run: python -m pytest -q
